###############################################################################
# STEEL SERIES GAUGE DATA SKIN CONFIGURATION FILE                             #
# Generates gauge-data.txt (mcrossley/SteelSeries-Weather-Gauges' own weewx   #
# template) for the Saratoga template's SteelSeries gauges page.              #
###############################################################################

SKIN_NAME = SteelSeriesGauge
SKIN_VERSION = 1.0

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator

[CheetahGenerator]
    # Plain text/JSON-ish output -- NOT html_entities. That default (used by
    # the Seasons skin) would HTML-escape the quote characters in the JSON
    # object, breaking the file for any JS/PHP parser reading it.
    encoding = strict_ascii

    [[ToDate]]
        [[[gauge_data]]]
            template = gauge-data.txt.tmpl
